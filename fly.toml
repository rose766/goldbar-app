# Fly.io deployment configuration for the Goldbar Command Center.
# https://fly.io/docs/reference/configuration/
#
# First-time setup (run from your local machine with the Fly CLI installed):
#
#   1. Register the app name (does NOT touch this file):
#      fly apps create goldbar-command-center
#      (if the name is taken, choose another and update the `app =` line below)
#
#   2. Create the persistent SQLite volume (underscore — must match source below):
#      fly volumes create goldbar_data --region iad --size 1 --app goldbar-command-center
#
#   3. Set secrets — never committed to git:
#      fly secrets set SESSION_SECRET="$(openssl rand -base64 32)" \
#                       DASHBOARD_PASSWORD="<your-password>" \
#                       CURRENT_USER_NAME="Rose" \
#                       --app goldbar-command-center
#
#   4. Deploy:
#      fly deploy
#
# To restore existing data after first deploy (volume starts empty):
#   Step 1 — upload restore-data.json via SSH pipe (never commits the file):
#     cat prisma/restore-data.json | fly ssh console \
#       -C "cat > /app/prisma/restore-data.json" --app goldbar-command-center
#   Step 2 — run the restore script:
#     fly ssh console \
#       -C "cd /app && node_modules/.bin/tsx prisma/restore.ts" \
#       --app goldbar-command-center
#   Step 3 — clean up the uploaded file from the container:
#     fly ssh console -C "rm /app/prisma/restore-data.json" --app goldbar-command-center

app = "goldbar-command-center"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  COOKIE_SECURE = "true"
  DATABASE_URL = "file:/app/data/goldbar.db"

# NOTE: No [deploy] release_command here.
# Fly.io release commands run in a temporary container WITHOUT volumes mounted,
# so a SQLite db push would target an ephemeral path and be discarded.
# The docker-entrypoint.sh already runs prisma db push + seed-scenarios on
# every startup against the real mounted volume at /app/data.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "goldbar_data"
  destination = "/app/data"
  initial_size = "1gb"
