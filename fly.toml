# Fly.io deployment configuration for the Goldbar Command Center.
# https://fly.io/docs/reference/configuration/
#
# First-time setup:
#   fly launch --no-deploy        # creates app, sets app name below
#   fly volumes create goldbar_data --size 1  # persistent SQLite storage
#   fly secrets set SESSION_SECRET=... DASHBOARD_PASSWORD=... CURRENT_USER_NAME=Rose
#   fly deploy
#
# To restore existing data after first deploy:
#   fly ssh console -C "cd /app && DATABASE_URL=file:/app/data/goldbar.db node_modules/.bin/tsx prisma/restore.ts"
#   (requires uploading restore-data.json to the container first via fly sftp)

app = "goldbar-command-center"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  COOKIE_SECURE = "true"
  DATABASE_URL = "file:/app/data/goldbar.db"

# NOTE: No [deploy] release_command here.
# Fly.io release commands run in a temporary container WITHOUT volumes mounted,
# so a SQLite db push would target an ephemeral path and be discarded.
# The docker-entrypoint.sh already runs prisma db push + seed-scenarios on
# every startup against the real mounted volume at /app/data.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "goldbar_data"
  destination = "/app/data"
  initial_size = "1gb"
